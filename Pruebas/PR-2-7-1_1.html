<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PR-2-7-1 - Ejercicio a: pestañas con target y z-index</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 36px 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }
    main {
      width: min(100%, 810px);
      margin: 0 auto;
    }
    .pestanas-a {
      display: grid;
      grid-template-columns: 94px 94px 94px minmax(0, 1fr);
      align-items: end;
      column-gap: 14px;
    }
    .pestana-a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 94px;
      min-height: 36px;
      padding: 9px 15px;
      border-radius: 4px 4px 0 0;
      color: #111;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      position: relative;
      z-index: 3;
      scroll-margin-top: 20px;
    }
    .primera-a {
      background: #62e65e;
    }
    .segunda-a {
      background: #4e78e8;
    }
    .tercera-a {
      background: #e9b2d7;
    }
    .pestana-a:target {
      filter: brightness(1.04);
    }
    .paneles-a {
      grid-column: 1 / -1;
      position: relative;
      isolation: isolate;
      height: 290px;
      width: 100%;
    }
    .panel-a {
      position: absolute;
      inset: 0;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      visibility: hidden;
      z-index: 0;
    }
    #contenido-a1 {
      background: #62e65e;
      opacity: 1;
      visibility: visible;
      z-index: 1;
    }
    #contenido-a2 {
      background: #4e78e8;
    }
    #contenido-a3 {
      background: #e9b2d7;
    }
    #pestana-a1:target ~ .paneles-a #contenido-a1,
    #pestana-a2:target ~ .paneles-a #contenido-a2,
    #pestana-a3:target ~ .paneles-a #contenido-a3 {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }
    #pestana-a2:target ~ .paneles-a #contenido-a1,
    #pestana-a3:target ~ .paneles-a #contenido-a1 {
      opacity: 0;
      visibility: hidden;
    }
    @media (max-width: 560px) {
      body {
        padding: 24px 12px;
      }
      .pestanas-a {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        column-gap: 7px;
      }
      .pestana-a {
        min-width: 0;
        width: 100%;
        padding: 9px 5px;
      }
    }
  </style>
</head>
<body>
  <main>

    <div class="pestanas-a">
      <a class="pestana-a primera-a" id="pestana-a1" href="#pestana-a1">Primera</a>
      <a class="pestana-a segunda-a" id="pestana-a2" href="#pestana-a2">Segunda</a>
      <a class="pestana-a tercera-a" id="pestana-a3" href="#pestana-a3">Tercera</a>

      <div class="paneles-a">
        <section class="panel-a" id="contenido-a1">
          Este es el contenido de la 1 PESTAÑA
        </section>
        <section class="panel-a" id="contenido-a2">
          Este es el contenido de la 2 PESTAÑA
        </section>
        <section class="panel-a" id="contenido-a3">
          Este es el contenido de la 3 PESTAÑA
        </section>
      </div>
    </div>
  </main>
</body>
</html>
