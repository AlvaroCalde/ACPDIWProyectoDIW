<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR-2-2-2 Álvaro Calderón</title>
<style>
  .grid-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    width: 600px;
  }
  .grid-container div {
    width: 80px;
    height: 80px;
    background-color: purple;
    color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  .grid-container div:nth-child(6) { background-color: green; } 
  .grid-container div:nth-child(3n):nth-child(-n+18) { background-color: green; } 
  .grid-container div:nth-child(n+8):nth-child(-n+20) { background-color: green; } 
  .grid-container div:nth-child(3n+5):nth-child(-n+23) { background-color: green; } 
  .grid-container div:nth-child(3), .grid-container div:nth-child(12) { background-color: green; } 
  .grid-container div:nth-child(12), .grid-container div:nth-child(18) { background-color: green; } 
</style>
</head>
<body>
  <div class="grid-container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
    <div>7</div>
    <div>8</div>
    <div>9</div>
    <div>10</div>
    <div>11</div>
    <div>12</div>
    <div>13</div>
    <div>14</div>
    <div>15</div>
    <div>16</div>
    <div>17</div>
    <div>18</div>
    <div>19</div>
    <div>20</div>
    <div>21</div>
    <div>22</div>
    <div>23</div>
    <div>24</div>
    <div>25</div>
  </div>
</body>
</html>
