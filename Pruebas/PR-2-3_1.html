<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR-2-3_1 Álvaro Calderón</title>
    <style>
        body {
            background-color: black;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .menu-contenedor {
            width: 300px;
        }
        .opcion {
            background-color: #ffb6c1; 
            color: white;
            text-align: center;
            padding: 15px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease; 
        }
        .opcion:hover {
            background-color: #800080; 
            transform: translateX(20px); 
        }
    </style>
</head>
<body>
    <div class="menu-contenedor">
        <div class="opcion">1 opcion</div>
        <div class="opcion">2 opcion</div>
        <div class="opcion">3 opcion</div>
        <div class="opcion">4 opcion</div>
    </div>
</body>
</html>
