<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR-2-7-3 · Menú hamburguesa</title>
    <style>
      :root {
        --fondo: #34495e;
        --barra: #287879;
        --menu: #5d887d;
        --borde: #a9c8c0;
        --activo: #df65df;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--fondo);
        font-family: Arial, Helvetica, sans-serif;
        color: #fff;
        min-height: 100vh;
      }
      .panel {
        max-width: 720px;
        min-height: 280px;
        background: #34495e;
        border: 1px solid #a9c8c0;
      }
      .topbar {
        height: 58px;
        background: var(--barra);
        border: 1px solid var(--borde);
        display: flex;
        align-items: center;
        padding: 8px;
      }
      .toggle {
        width: 40px;
        height: 38px;
        border: 0;
        border-radius: 5px;
        background: #777;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        padding: 7px;
        cursor: pointer;
      }
      .toggle span {
        height: 4px;
        width: 100%;
        background: #fff;
        border-radius: 1px;
      }
      .drawer {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(290px, 82vw);
        background: var(--menu);
        border-right: 3px solid #34495e;
        z-index: 3;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }
      .drawer .topbar {
        height: 58px;
      }
      nav {
        display: flex;
        flex-direction: column;
      }
      nav a {
        padding: 12px;
        color: #f5f5f5;
        text-decoration: none;
        font-family: Georgia, serif;
        font-size: 17px;
        border-bottom: 3px solid #729b91;
      }
      nav a:hover,
      nav a:focus,
      nav a.active {
        background: var(--activo);
        color: white;
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
        z-index: 2;
        cursor: pointer;
      }
      /* Ocultamos el checkbox real */
      #menu-toggle {
        display: none;
      }
      /* Cuando el checkbox está marcado, mostramos el menú lateral */
      #menu-toggle:checked ~ .drawer {
        transform: translateX(0);
      }
      /* Cuando el checkbox está marcado, mostramos el fondo oscuro */
      #menu-toggle:checked ~ .scrim {
        opacity: 1;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <input type="checkbox" id="menu-toggle" />
    <header class="topbar">
      <label for="menu-toggle" class="toggle" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </label>
    </header>

    <label
      for="menu-toggle"
      class="scrim"
      id="scrim"
      aria-label="Cerrar menú"
    ></label>

    <aside class="drawer" id="drawer" aria-label="Menú lateral">
      <header class="topbar">
        <label for="menu-toggle" class="toggle" aria-label="Cerrar menú">
          <span></span>
          <span></span>
          <span></span>
        </label>
      </header>
      <nav>
        <a href="#" class="active">Inicio</a>
        <a href="#">Alumnos</a>
        <a href="#">Secretaria</a>
        <a href="#">Profesorado</a>
      </nav>
    </aside>
  </body>
</html>
