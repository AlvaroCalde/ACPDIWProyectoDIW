<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR-1-1-2 Álvaro Calderón</title>
    <style>
        body{
            margin: 20px;
            font-family: sans-serif;
            font-weight: bold;
        }
        *{
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        table{
            width: 100%;
            table-layout: fixed;
            margin-bottom: 30px;
            border-spacing: 0;
            & caption {
                text-align: left;
                font-size: 1.1em;
                margin-bottom: 10px;
            }
            & td{
                text-align: center; 
                height: 56px; 
                border: 2px solid white; 
            }
        }
        .colorC{display: none;}
        
        table{
            & td:nth-child(1){background: #FF0000;}
            & td:nth-child(2){background: #00FF00;}
            & td:nth-child(3){background: #0000FF; color: white;}
            & td:nth-child(1):hover{background: #00FFFF;}
            & td:nth-child(2):hover{background: #FF00FF;}
            & td:nth-child(3):hover{background: #FFFF00; color: black;}
            & td:hover .colorO{display: none;}
            & td:hover .colorC{display: inline;}
        }



        
    </style>
</head>
<body>

    <table>
        <caption>Colores RGB, al pasar el ratón por encima,muestran el color complementario</caption>
        <tr>
            <td>
                <span class="colorO">Color rojo #FF0000</span>
                <span class="colorC">Color cyan #00FFFF</span>
            </td>
            <td>
                <span class="colorO">Color verde #00FF00</span>
                <span class="colorC">Color magenta #FF00FF</span>
            </td>
            <td>
                <span class="colorO">Color azul #0000FF</span>
                <span class="colorC">Color amarillo #FFFF00</span>
                
            </td>
        </tr>
    </table>
</body>
</html>
